name: Code Formatter

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/code_formatter.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -U ruff

      - name: Run Ruff Formatter (check)
        run: ruff format --check .

      - name: Run Ruff Linter (critical rules)
        run: ruff check --select F,E9 .

      - name: Summary of all rules
        if: ${{ always() }}
        run: |
          ruff check . --statistics > ruff_full.log 2>&1 || true
          {
            echo "## Ruff: statistics for rules from \`ruff.toml\` (\`select = ALL\`)"
            echo
            echo '```'
            head -40 ruff_full.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"