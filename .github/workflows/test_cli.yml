name: CLI Scripts Test

on:
  push:
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'app.py'
      - 'gradio_ui/**'
      - 'rvc/**'
      - '.github/workflows/test_cli.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'app.py'
      - 'gradio_ui/**'
      - 'rvc/**'
      - '.github/workflows/test_cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rvc_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        pip install --no-cache-dir uv
        # Версии зеркалят локальную установку (run-MistRVC-installer.bat/.sh) и code_linter.yml
        uv pip install --no-cache-dir torch==2.11 torchaudio==2.11 torchcodec==0.11 --index-url https://download.pytorch.org/whl/cpu -q --system
        uv pip install --no-cache-dir -r requirements.txt -q --system

    - name: Unit test noise gate
      run: |
        python3 - <<'PY'
        import numpy as np
        from rvc.inference.infer import _noise_gate

        sr = 40000
        rng = np.random.default_rng(0)
        quiet = (rng.standard_normal(sr) * 1e-4).astype(np.float32)   # ~ -80 dBFS
        tone = (0.2 * np.sin(2 * np.pi * 220 * np.arange(sr) / sr)).astype(np.float32)
        x = np.concatenate([quiet, tone, quiet])
        y = _noise_gate(x, sr)
        assert y.shape == x.shape, "длина изменилась"
        assert np.isfinite(y).all()
        m = sr // 2
        assert np.abs(y[:m]).max() < 1e-6, "шум слева не подавлен"
        assert np.abs(y[-m:]).max() < 1e-6, "шум справа не подавлен"
        mid = slice(sr + sr // 4, 2 * sr - sr // 4)
        assert np.allclose(y[mid], x[mid], atol=1e-6), "полезный сигнал искажён"
        assert np.abs(_noise_gate(quiet, sr)).max() < 1e-6, "тихий файл не обнулён"
        loud = (0.2 * rng.standard_normal(3 * sr)).astype(np.float32)
        assert np.allclose(_noise_gate(loud, sr), loud, atol=1e-6), "громкий файл изменён"
        print("noise gate OK")
        PY

    - name: Install RVC models
      run: |
        python3 -m rvc.inference.modules.model_manager "https://huggingface.co/Politrees/Victor_Tsoi/resolve/main/Victor_Tsoi.zip?download=true" "Tsoi"

    - name: Set up test audio
      run: |
        mkdir -p audio
        wget https://huggingface.co/Politrees/audio_for_test/resolve/main/BritishEnglishUKTest5.mp3 -O audio/test.mp3

    - name: Run rvc script (дефолты CLI = настройки UI)
      run: |
        python3 -m rvc.inference.infer_cli rvc --input_path "audio/test.mp3" --rvc_model "Tsoi"

    - name: Run rvc script (rmvpe, узкий F0, питч -6, mp3)
      run: |
        python3 -m rvc.inference.infer_cli rvc --input_path "audio/test.mp3" --rvc_model "Tsoi" --f0_method "rmvpe" --f0_min 62 --f0_max 1108 --rvc_pitch -6 --protect 0.5 --index_rate 0 --volume_envelope 1 --output_format "mp3"

    - name: Verify output audio
      run: |
        python3 - <<'PY'
        import glob
        import numpy as np
        import soundfile as sf
        import torch

        pth = glob.glob("models/RVC_models/Tsoi/*.pth")[0]
        cpt = torch.load(pth, map_location="cpu", weights_only=True)
        expected_sr = cpt["config"][-1]

        src, src_sr = sf.read("audio/test.mp3")
        src_sec = len(src) / src_sr

        files = glob.glob("output/RVC_output/*")
        assert files, "Выходных файлов нет"
        for f in files:
            audio, sr = sf.read(f)
            if f.lower().endswith(".mp3"):
                assert sr in (32000, 44100, 48000), f"{f}: sr={sr}, нестандартная частота MP3"
            else:
                assert sr == expected_sr, f"{f}: sr={sr}, ожидалось {expected_sr}"
            assert np.isfinite(audio).all(), f"{f}: NaN/Inf в сэмплах"
            sec = len(audio) / sr
            assert 0.7 * src_sec < sec < 1.4 * src_sec, f"{f}: {sec:.1f}s против {src_sec:.1f}s исходника"
            rms = float(np.sqrt(np.mean(audio ** 2)))
            assert rms > 1e-4, f"{f}: тишина (RMS={rms:.2e})"
            print(f"OK {f}: {sr} Hz, {sec:.1f} s, RMS={rms:.4f}")
        PY

    - name: Smoke import UI и обучение
      run: |
        python3 -c "import app; print('app import OK; UVR доступен:', app.uvr_ui is not None)"
        python3 -m rvc.training.train --help > /dev/null && echo "train CLI OK"

    - name: List output files
      if: ${{ !cancelled() }}
      run: ls -laR output || true

    - name: Upload RVC output artifact
      uses: actions/upload-artifact@v7
      with:
        name: rvc-audio-${{ matrix.python-version }}
        path: output/RVC_output/
        if-no-files-found: error
        retention-days: 14