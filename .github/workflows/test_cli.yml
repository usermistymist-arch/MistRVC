name: CLI Scripts Test

on:
  push:
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'rvc/_library/**'
      - 'rvc/inference/**'
      - '.github/workflows/test_cli.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'rvc/_library/**'
      - 'rvc/inference/**'
      - '.github/workflows/test_cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rvc_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip for Python <3.11
      if: ${{ matrix.python-version == '3.10' }}
      run: |
        python -m pip install --upgrade "pip<=24.0"

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        pip install --no-cache-dir uv
        uv pip install --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu -q --system
        uv pip install --no-cache-dir -r requirements.txt -q --system

    - name: Install RVC models
      run: |
        python3 -m rvc.inference.modules.model_manager "https://huggingface.co/Politrees/Victor_Tsoi/resolve/main/Victor_Tsoi.zip?download=true" "Tsoi"

    - name: Set up test audio
      run: |
        mkdir -p audio
        wget https://huggingface.co/Politrees/audio_for_test/resolve/main/BritishEnglishUKTest5.mp3 -O audio/test.mp3

    - name: Run rvc script
      run: |
        python3 -m rvc.inference.infer_cli rvc --input_path "audio/test.mp3" --rvc_model "Tsoi" --f0_method "hpa-rmvpe" --f0_min 62 --f0_max 1108 --rvc_pitch -6 --protect 0.4 --index_rate 0.1 --volume_envelope 0.5 --output_format "flac"

    - name: List output files
      if: ${{ !cancelled() }}
      run: ls -laR output || true

    - name: Upload RVC output artifact
      uses: actions/upload-artifact@v7
      with:
        name: rvc-audio-${{ matrix.python-version }}
        path: output/RVC_output/
        if-no-files-found: error
        retention-days: 14